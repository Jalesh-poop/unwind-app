<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#131359">
<title>unwind</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Boogaloo&family=Newsreader:ital,wght@1,400&family=Inter:wght@400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #131359;
    font-family: 'Inter', sans-serif;
    touch-action: none;
  }

  #sky {
    position: fixed; inset: 0;
    background: linear-gradient(180deg,
      #0c0c3d 0%,
      #131359 30%,
      #232F72 55%,
      #2F5689 78%,
      #35ADA2 100%);
    transition: filter 0.4s ease;
  }

  #vignette {
    position: fixed; inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 60%, transparent 40%, rgba(4,5,25,0.55) 100%);
    opacity: 0.5;
    transition: opacity 0.3s ease;
  }

  #grain {
    position: fixed; inset: 0;
    pointer-events: none;
    opacity: 0.045;
    mix-blend-mode: overlay;
  }

  .star {
    position: fixed;
    width: 2px; height: 2px;
    background: #f5f6ee;
    border-radius: 50%;
    animation: twinkle 4s ease-in-out infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.12; }
    50% { opacity: 0.6; }
  }

  #logo {
    position: fixed;
    top: 5%;
    left: 0; right: 0;
    text-align: center;
    pointer-events: none;
  }

  #logo span {
    font-family: 'Boogaloo', cursive;
    font-size: 34px;
    letter-spacing: 0.5px;
    color: #35ADA2;
    -webkit-text-stroke: 1.5px #f5f6ee;
    text-stroke: 1.5px #f5f6ee;
    transform: rotate(-3deg) skewX(-4deg);
    display: inline-block;
  }

  #prompt {
    position: fixed;
    top: 15%;
    left: 0; right: 0;
    text-align: center;
    color: #f5f6ee;
    opacity: 0.75;
    transition: opacity 0.5s ease;
    pointer-events: none;
  }

  #prompt .headline {
    font-family: 'Newsreader', serif;
    font-style: italic;
    font-size: 21px;
    font-weight: 400;
    margin-bottom: 6px;
  }

  #prompt .sub {
    font-size: 12px;
    letter-spacing: 0.06em;
    color: #b9c4e0;
    opacity: 0.7;
  }

  #trail {
    position: fixed; inset: 0;
    pointer-events: none;
  }

  #tether {
    position: fixed; inset: 0;
    pointer-events: none;
  }

  #plane {
    position: fixed;
    left: 50%; top: 78%;
    width: 46px; height: 46px;
    margin-left: -23px; margin-top: -23px;
    cursor: grab;
    touch-action: none;
    will-change: transform;
  }

  #plane:active { cursor: grabbing; }

  #quote {
    position: fixed;
    top: 42%;
    left: 8%; right: 8%;
    text-align: center;
    font-family: 'Newsreader', serif;
    font-style: italic;
    font-size: clamp(19px, 5.2vw, 28px);
    line-height: 1.45;
    color: #fdfaf3;
    opacity: 0;
    pointer-events: none;
    text-shadow: 0 2px 24px rgba(0,0,0,0.4);
  }

  #counter {
    position: fixed;
    bottom: 4%;
    left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: #b9c4e0;
    opacity: 0.4;
  }
</style>
</head>
<body>

<div id="sky"></div>
<div id="vignette"></div>
<svg id="grain" width="100%" height="100%">
  <filter id="noiseFilter">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#noiseFilter)"/>
</svg>

<div id="stars"></div>

<div id="logo"><span>unwind</span></div>

<div id="prompt">
  <div class="headline">pull it back. let it go.</div>
  <div class="sub">hold the plane, pull down, release</div>
</div>

<svg id="tether" width="100%" height="100%">
  <line id="tether-line" x1="0" y1="0" x2="0" y2="0" stroke="#f5f6ee" stroke-width="1" stroke-dasharray="4 5" opacity="0"/>
</svg>

<canvas id="trail"></canvas>

<svg id="plane" viewBox="0 0 100 100">
  <polygon points="50,4 88,88 50,68" fill="#fdfaf3"/>
  <polygon points="50,4 12,88 50,68" fill="#c9d3e8"/>
  <polygon points="50,68 88,88 50,96" fill="#35ADA2"/>
</svg>

<div id="quote"></div>
<div id="counter"></div>

<script>
  const plane = document.getElementById('plane');
  const sky = document.getElementById('sky');
  const vignette = document.getElementById('vignette');
  const prompt = document.getElementById('prompt');
  const logo = document.getElementById('logo');
  const quoteEl = document.getElementById('quote');
  const counterEl = document.getElementById('counter');
  const tetherLine = document.getElementById('tether-line');
  const canvas = document.getElementById('trail');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const starsWrap = document.getElementById('stars');
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 55 + 'vh';
    s.style.animationDelay = (Math.random() * 4) + 's';
    starsWrap.appendChild(s);
  }

  const QUOTES = {
    low: [
      "you don't have to hold this all the way home.",
      "a small pull is still a release.",
      "let today's weight land somewhere else for a while.",
      "you're allowed to set this down gently.",
      "some days just need a little air let out.",
      "this doesn't have to be a big thing to matter.",
      "even a light hand can loosen a tight day.",
      "not everything needs force to let go.",
      "you came here to breathe. that's enough.",
      "small releases add up to something real.",
      "you're not behind. you're just here, finally.",
      "this is what taking care of yourself looks like."
    ],
    mid: [
      "that's the weight leaving, not you falling apart.",
      "let it go before it becomes something you carry.",
      "you've been holding that longer than you needed to.",
      "this is you choosing to put it down.",
      "the tension was never meant to stay this long.",
      "some days the bravest thing is releasing, not gripping.",
      "you don't need to explain why today was heavy.",
      "let it fly further than the thought that's chasing you.",
      "this pressure was never yours to keep.",
      "you're allowed to want this day to be over.",
      "throwing it doesn't mean you lost. it means you're lighter.",
      "that knot in your chest just loosened a little."
    ],
    high: [
      "that's everything you were carrying, gone in one throw.",
      "you just launched what you couldn't say out loud.",
      "let it go so far it stops being your problem tonight.",
      "this is what letting go looks like when you mean it.",
      "you don't have to be calm to be okay. you just have to let go.",
      "everything you clenched all day, gone in one motion.",
      "you pulled hard because you were holding harder.",
      "this is your exhale. let it travel.",
      "some days you don't heal quietly. you launch it.",
      "that's not losing control. that's finally releasing it.",
      "you needed that more than you admitted.",
      "the harder the pull, the more it needed to leave."
    ]
  };

  function pickQuote(power) {
    const tier = power > 0.7 ? 'high' : power > 0.35 ? 'mid' : 'low';
    const key = 'unwind_seen_' + tier;
    let seen = JSON.parse(localStorage.getItem(key) || '[]');
    const pool = QUOTES[tier];
    if (seen.length >= pool.length) seen = [];
    let idx;
    do { idx = Math.floor(Math.random() * pool.length); } while (seen.includes(idx) && seen.length < pool.length);
    seen.push(idx);
    localStorage.setItem(key, JSON.stringify(seen));
    return pool[idx];
  }

  function bumpCounter() {
    const n = parseInt(localStorage.getItem('unwind_count') || '0', 10) + 1;
    localStorage.setItem('unwind_count', n);
    return n;
  }

  function showCounter() {
    const n = parseInt(localStorage.getItem('unwind_count') || '0', 10);
    counterEl.textContent = n > 0 ? n + (n === 1 ? ' released' : ' released') : '';
  }
  showCounter();

  let padX, padY;
  function setPad() {
    padX = window.innerWidth / 2;
    padY = window.innerHeight * 0.78;
  }
  setPad();
  window.addEventListener('resize', setPad);

  let dragging = false;
  let flying = false;
  let dx = 0, dy = 0;
  const MAX_PULL = 130;
  let particles = [];

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function setPlaneTransform(x, y, rot, scale) {
    plane.style.transform = `translate(${x - padX}px, ${y - padY}px) rotate(${rot}deg) scale(${scale})`;
  }

  function onDown() {
    if (flying) return;
    dragging = true;
    prompt.style.opacity = '0';
  }

  function getPoint(e) {
    if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }

  function onMove(e) {
    if (!dragging) return;
    const p = getPoint(e);
    let rawDx = p.x - padX;
    let rawDy = p.y - padY;
    const dist = Math.min(Math.hypot(rawDx, rawDy), MAX_PULL);
    const ang = Math.atan2(rawDy, rawDx);
    dx = Math.cos(ang) * dist;
    dy = Math.sin(ang) * dist;
    if (dy < 0) dy = Math.abs(dy) * 0.15;

    const pull = dist / MAX_PULL;
    const planeX = padX + dx;
    const planeY = padY + dy;

    const rot = clamp((dx / MAX_PULL) * 22, -22, 22);
    setPlaneTransform(planeX, planeY, rot, 1 - pull * 0.15);

    tetherLine.setAttribute('x1', padX);
    tetherLine.setAttribute('y1', padY);
    tetherLine.setAttribute('x2', planeX);
    tetherLine.setAttribute('y2', planeY);
    tetherLine.setAttribute('opacity', 0.15 + pull * 0.35);

    vignette.style.opacity = 0.5 + pull * 0.3;
    sky.style.filter = `saturate(${1 + pull * 0.5}) brightness(${1 - pull * 0.08})`;
  }

  function onUp() {
    if (!dragging) return;
    dragging = false;
    tetherLine.setAttribute('opacity', 0);

    const dist = Math.hypot(dx, dy);
    if (dist < 12) {
      resetPlane();
      return;
    }
    launch();
  }

  function resetPlane() {
    dx = 0; dy = 0;
    setPlaneTransform(padX, padY, 0, 1);
    vignette.style.opacity = 0.5;
    sky.style.filter = 'none';
  }

  function angleFromUp(vx, vy) {
    return Math.atan2(vx, -vy) * 180 / Math.PI;
  }

  function launch() {
    flying = true;
    const power = Math.min(Math.hypot(dx, dy) / MAX_PULL, 1);
    const launchAngle = Math.atan2(-dy, -dx);
    const speed = 900 + power * 700;

    const startX = padX + dx;
    const startY = padY + dy;
    let vx = Math.cos(launchAngle) * speed;
    let vy = Math.sin(launchAngle) * speed - 250 - power * 200;

    let x = startX, y = startY;
    let t0 = null;
    const gravity = 380;
    let quoteShown = false;
    const quote = pickQuote(power);

    sky.style.filter = `saturate(${1 + power * 0.5}) brightness(${1 - power * 0.08})`;

    function frame(ts) {
      if (!t0) t0 = ts;
      const dt = Math.min((ts - (frame.last || t0)) / 1000, 0.032);
      frame.last = ts;

      vy += gravity * dt;
      x += vx * dt;
      y += vy * dt;

      const rot = clamp(angleFromUp(vx, vy), -70, 70);
      const elapsed = (ts - t0) / 1000;
      const fade = Math.max(0, 1 - elapsed / 2.6);
      setPlaneTransform(x, y, rot, 0.85 * fade + 0.15);
      plane.style.opacity = fade;

      particles.push({ x, y, life: 1 });
      particles.forEach(p => p.life -= 0.035);
      particles = particles.filter(p => p.life > 0);

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.4 * p.life, 0, Math.PI * 2);
        const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 2.4 * p.life);
        grd.addColorStop(0, `rgba(245,246,238,${0.5 * p.life})`);
        grd.addColorStop(1, `rgba(53,173,162,0)`);
        ctx.fillStyle = grd;
        ctx.fill();
      });

      if (!quoteShown && elapsed > 0.55) {
        quoteShown = true;
        quoteEl.textContent = quote;
        quoteEl.style.transition = 'opacity 1.1s ease';
        quoteEl.style.opacity = '1';
      }

      const offscreen = x < -80 || x > window.innerWidth + 80 || y < -80 || y > window.innerHeight + 80;

      if (elapsed < 3.4 && !offscreen) {
        requestAnimationFrame(frame);
      } else {
        endFlight();
      }
    }
    requestAnimationFrame(frame);
  }

  function endFlight() {
    quoteEl.style.transition = 'opacity 1.4s ease';
    quoteEl.style.opacity = '0';
    bumpCounter();
    setTimeout(() => {
      particles = [];
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      plane.style.opacity = '1';
      plane.style.transition = 'transform 0.7s cubic-bezier(0.22, 1, 0.36, 1)';
      resetPlane();
      setTimeout(() => { plane.style.transition = 'none'; }, 750);
      vignette.style.opacity = '0.5';
      sky.style.filter = 'none';
      flying = false;
      showCounter();
    }, 500);
  }

  plane.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  plane.addEventListener('touchstart', onDown, { passive: true });
  window.addEventListener('touchmove', onMove, { passive: true });
  window.addEventListener('touchend', onUp);

  resetPlane();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
